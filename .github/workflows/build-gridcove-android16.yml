name: Build GridCove Android 16 APK

on:
  pull_request:
    branches: [ master ]
    paths:
      - "android16-app/**"
      - ".github/workflows/build-gridcove-android16.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android16-app
    env:
      GRIDCOVE_STORE_PASSWORD: GridCoveBot2026Build
      GRIDCOVE_KEY_PASSWORD: GridCoveBot2026Build
      GRIDCOVE_KEY_ALIAS: gridcove

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Generate release signing key
        run: |
          mkdir -p signing
          keytool -genkeypair -v \
            -keystore signing/gridcove-bot-release.jks \
            -alias "$GRIDCOVE_KEY_ALIAS" \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -storepass "$GRIDCOVE_STORE_PASSWORD" \
            -keypass "$GRIDCOVE_KEY_PASSWORD" \
            -dname "CN=GridCove Ubuntu Bot, OU=Private Android, O=GridCove, L=Private, ST=Private, C=US"
      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Verify package
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/GridCove-Ubuntu-Bot-Android16-1.0.3.apk
          cp signing/gridcove-bot-release.jks dist/gridcove-bot-release.jks
          printf '%s\n' 'Keep this keystore for future app updates.' 'Alias: gridcove' 'Store password: GridCoveBot2026Build' 'Key password: GridCoveBot2026Build' > dist/SIGNING-KEY-README.txt
          sha256sum dist/GridCove-Ubuntu-Bot-Android16-1.0.3.apk > dist/GridCove-Ubuntu-Bot-Android16-1.0.3.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: GridCove-Ubuntu-Bot-Android16-1.0.3
          path: android16-app/dist/*
          if-no-files-found: error
          retention-days: 7
